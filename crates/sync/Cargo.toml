[package]
name = "octopus-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
# 项目内依赖
octopus-infra = { path = "../infra" }

# clipboard.key AES-256-GCM 加密——与 vault DerivedKey 同 v1: 格式（byte-compatible）。
# sync 不能依赖 vault（vault 已依赖 sync，会形成循环），故在此 crate 内联对称加密原语。
# 与 store::write_atomically 同模式（vault private 跨 crate 拿不到 → sync 内联）。
aes-gcm = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
data-encoding = "2"
# clipboard.key hex 编码（32B 随机 key 存文件）
hex = "0.4"

# hash 工具（不是安全用途——纯内容指纹 diff）
sha2.workspace = true
# md5 用于 sync 增量同步的内容指纹（不是安全用途——纯 diff 工具）
md-5 = "0.10"

# 私有库检测（调 GitHub/Gitee API 查 private 字段）
# 用同步 HTTP 客户端——与 sync 模块的阻塞 shell-out 风格一致，不引入 async runtime
ureq = { version = "2", features = ["json", "tls"] }

# URL parsing（matcher 用）
url = "2"

# 序列化/工具
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
regex = "1"

[dev-dependencies]
# sync 模块测试用 tempfile 隔离文件系统
tempfile = "3"
# 集成测试用 set_test_db 注入内存 DB（hotword pull/push 测试）
# 与 octopus-infra 同版本同 feature（避免重复链接两份 sqlite）
rusqlite = { version = "0.31", features = ["bundled"] }
