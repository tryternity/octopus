[package]
name = "octopus-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
octopus-asr-local = { path = "../asr-local" }
octopus-asr-cloud = { path = "../asr-cloud" }
cpal = "0.16"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
octopus-infra = { path = "../infra" }
octopus-download = { path = "../download" }
