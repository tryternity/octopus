[package]
name = "octopus-ocr"
version = "0.1.0"
edition = "2021"
include = ["src/**/*", "assets/words_common.txt"]

[dependencies]
octopus-infra = { path = "../infra" }
octopus-paddle-ocr = { path = "../paddle-ocr" }
parking_lot = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
zxing-cpp = { version = "0.5", features = ["bundled"] }
