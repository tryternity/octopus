[package]
name = "octopus-infra"
version = "0.1.0"
edition = "2021"

# 基础设施 crate：无项目内 crate 依赖，可被任意项目 crate 依赖。
# 含 consts（固定常量）+ paths（octopus_config_home 等路径工具）；未来加时间等。

[dependencies]
once_cell = "1"
parking_lot = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
pinyin = "0.10"
