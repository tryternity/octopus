[package]
name = "octopus-infra"
version = "0.1.0"
edition = "2021"
# release 打包要带上外置 seed 文件（seeds/prompts/*.md 被运行期 std::fs::read_to_string
# 读取（seeds.rs），也被桌面端「复原默认」按钮按路径读取）。缺此字段时 cargo publish 只发 src/。
include = ["src/**", "seeds/**", "Cargo.toml"]

# 基础设施 crate：无项目内 crate 依赖，可被任意项目 crate 依赖。
# 含 consts（固定常量）+ paths（octopus_config_home 等路径工具）；未来加时间等。

[dependencies]
once_cell.workspace = true
parking_lot = { workspace = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
anyhow.workspace = true
log.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
pinyin = "0.10"
sysinfo = "0.32"
uuid = { version = "1", features = ["v5"] }
# md5 用于热词 word sync_md5 内容指纹（纯 diff 用途，非安全）——2026-08-01 word 级 merge。
# infra 是无项目内依赖的底层 crate，但允许外部 crate 依赖（md-5 与 sync crate 同版本）。
md-5 = "0.10"
