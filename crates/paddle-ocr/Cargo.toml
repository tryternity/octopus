[package]
name = "octopus-paddle-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["ndarray", "download-binaries"] }
image = { version = "0.25", default-features = true, features = ["png", "jpeg"] }
imageproc = "0.25"
ndarray = "0.17"
nalgebra = "0.33"
rayon = "1.10"
num_cpus = "1.16"
geo-types = "0.7"
geo-clipper = "0.9.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-bidi = "0.3"
log = "0.4"

[features]
opencv-backend = []
