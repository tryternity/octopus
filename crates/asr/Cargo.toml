[package]
name = "octopus-asr"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "2.0.0-rc.12", features = [
    "download-binaries",
    "cuda",
    "coreml",
    "directml",
] }
ndarray = "0.17"
anyhow = "1"
once_cell = "1"
hound = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokenizers = "0.21"
rustfft = "6"
# RNNoise 流式降噪（纯 Rust，内置默认模型）。曾用 DeepFilterNet3 dfn3.onnx，但该流式逐帧
# 导出模型存在缺陷（压语音），已弃用，改用 nnnoiseless（Xiph RNNoise 移植）。
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet3 原生降噪（libDF v0.5.6 + tract 0.19，spec 2026-06-17）。
# ndarray 0.15（libDF 版本）与上方 0.17（ort/asr）共存：rename 隔离，Df3Backend 边界转换。
ndarray_015 = { package = "ndarray", version = "0.15", default-features = false }
df = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", default-features = false, features = ["tract", "default-model", "transforms"] }
base64 = "0.22"
kaldi-native-fbank = "0.1.0"
log = "0.4"
# 基础设施（跨 crate 共享常量等）
octopus-infra = { path = "../infra" }
octopus-llm = { path = "../llm" }

jieba-rs = "0.6"
pinyin = "0.10"
flate2 = "1.0"


