[package]
name = "octopus-asr"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.17"
anyhow = "1"
once_cell = "1"
hound = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokenizers = "0.21"
rustfft = "6"
base64 = "0.22"
kaldi-native-fbank = "0.1.0"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
