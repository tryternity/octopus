[package]
name = "octopus-capx"
version = "0.1.0"
edition = "2021"

[dependencies]
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
