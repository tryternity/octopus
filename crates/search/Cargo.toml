[package]
name = "octopus-search"
version = "0.1.0"
edition = "2021"

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
octopus-infra = { path = "../infra" }
pinyin = "0.10"

[dev-dependencies]
tempfile = "3"
