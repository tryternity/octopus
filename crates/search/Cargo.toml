[package]
name = "octopus-search"
version = "0.1.0"
edition = "2021"

[dependencies]
nucleo-matcher = "0.3"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio = { version = "1", features = ["full"] }
dirs = "5"
octopus-infra = { path = "../infra" }
pinyin = "0.10"
base64 = "0.22"
parking_lot.workspace = true
async-trait.workspace = true
futures = "0.3"
evalexpr = "11"
plist = "1"
# 与 infra 同版本（0.31 + bundled），避免重复链接 SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
