[package]
name = "octopus-download"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2", "rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
log = "0.4"
anyhow = "1"

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
