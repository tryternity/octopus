[package]
name = "octopus-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
octopus-infra = { path = "../infra" }

[dev-dependencies]
octopus-asr-local = { path = "../asr-local" }
