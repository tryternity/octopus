[package]
name = "octopus-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "octopus-egui"
path = "src/main.rs"

# 依赖按 task 渐进：Task 4 eframe 核心；Task 5 IPC（infra/serde/anyhow/log）；
# Task 6 NotepadView（notepad store + egui_commonmark，后者届时做版本配对）。
[dependencies]
eframe = "0.29"
egui = "0.29"
egui_commonmark = "0.18"          # md 预览（与 egui 0.29 配对）
octopus-infra = { path = "../infra" }
octopus-notepad = { path = "../notepad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# macOS Accessory 激活策略（无 Dock 图标）；非 macOS 走 macos.rs 的 no-op
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
