<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>octopus</title>
    <script>
      // 阻断式主题恢复——在 body 解析前执行，消除主题闪烁。
      // 注意：__TAURI_INTERNALS__ 此时可能尚未注入，窗口 label 判断
      // 和背景色设置放到 main.tsx（那时桥接层已就绪）。
      try {
        var themeId = localStorage.getItem("octopus-theme-id");
        if (themeId) {
          document.documentElement.setAttribute("data-theme", themeId);
          // 自定义主题：从 localStorage 恢复 CSS 规则（消除 IPC 延迟）
          var builtin = ["light", "glass-dark", "nord"];
          if (builtin.indexOf(themeId) === -1) {
            var css = localStorage.getItem("octopus-custom-theme-css");
            if (css) {
              var s = document.createElement("style");
              s.id = "octopus-custom-theme";
              s.textContent = css;
              document.head.appendChild(s);
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
