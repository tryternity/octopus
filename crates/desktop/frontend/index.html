<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>octopus</title>
    <script>
      // 阻断式主题恢复 + 背景色注入——在 body 解析前执行。
      // bg 参数是裸 hex（如 "2e3440"），由 Rust 建窗时从主题配置注入。
      // 直接设 #hex 而非 var(--color-background)——不依赖 CSS 加载，首帧即有色。
      try {
        var themeId = localStorage.getItem("octopus-theme-id");
        if (themeId) {
          document.documentElement.setAttribute("data-theme", themeId);
          // 自定义主题：从 localStorage 恢复 CSS 规则
          var builtin = ["light", "glass-dark", "nord"];
          if (builtin.indexOf(themeId) === -1) {
            var css = localStorage.getItem("octopus-custom-theme-css");
            if (css) {
              var s = document.createElement("style");
              s.id = "octopus-custom-theme";
              s.textContent = css;
              document.head.appendChild(s);
            }
          }
        }
        // 背景色：URL 参数注入裸 hex（零 CSS 依赖），或 localStorage 兜底
        var params = new URLSearchParams(window.location.search);
        var bg = params.get("bg");
        if (!bg) {
          // 无 URL 参数（如 result/clipboard/screenshot 透明窗口）——用 localStorage 兜底
          // 仅用于首次打开前的缓存恢复（settings/compact_editor 从 Rust 得到 bg 参数后覆盖）
          bg = localStorage.getItem("octopus-bg-hex");
        }
        if (bg) {
          // 裸 hex 加 #，已有 # 或 rgba 不重复加
          var color = bg.startsWith("#") || bg.startsWith("rgb") ? bg : "#" + bg;
          document.documentElement.style.backgroundColor = color;
          // 缓存供下次无 URL 参数时兜底
          if (!bg.startsWith("rgb")) {
            localStorage.setItem("octopus-bg-hex", bg);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
