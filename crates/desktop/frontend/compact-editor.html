<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>octopus-compact-editor</title>
    <script>
      // 阻断式主题恢复 + 背景色注入（非透明窗口，Rust 注入 bg）。
      try {
        var themeId = localStorage.getItem("octopus-theme-id");
        if (themeId) {
          document.documentElement.setAttribute("data-theme", themeId);
          var builtin = ["light", "glass-dark", "nord", "raycast"];
          if (builtin.indexOf(themeId) === -1) {
            var css = localStorage.getItem("octopus-custom-theme-css");
            if (css) {
              var s = document.createElement("style");
              s.id = "octopus-custom-theme";
              s.textContent = css;
              document.head.appendChild(s);
            }
          }
        }
        var params = new URLSearchParams(window.location.search);
        var bg = params.get("bg");
        if (bg) {
          var color = bg.startsWith("#") || bg.startsWith("rgb") ? bg : "#" + bg;
          document.documentElement.style.backgroundColor = color;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/compact-editor-main.tsx"></script>
  </body>
</html>
