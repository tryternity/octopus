<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>octopus-screenshot</title>
    <script>
      // 阻断式主题恢复 + 背景色注入——在 body 解析前执行。
      // 与 index.html 同范式：首帧即应用正确主题，避免 React mount 前的 FOUC。
      // screenshot 是透明窗口，无 bg 参数（保持透明，不设背景色）。
      try {
        var themeId = localStorage.getItem("octopus-theme-id");
        if (themeId) {
          document.documentElement.setAttribute("data-theme", themeId);
          var builtin = ["light", "glass-dark", "nord", "raycast"];
          if (builtin.indexOf(themeId) === -1) {
            var css = localStorage.getItem("octopus-custom-theme-css");
            if (css) {
              var s = document.createElement("style");
              s.id = "octopus-custom-theme";
              s.textContent = css;
              document.head.appendChild(s);
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/screenshot-main.tsx"></script>
  </body>
</html>
