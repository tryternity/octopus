[package]
name = "octopus-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = { version = "0.12", optional = true }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"

# octopus-asr (embedded engine)
octopus-asr = { path = "../asr", optional = true }

# Audio
cpal = "0.16"
rubato = "0.16"

# Paste
enigo = "0.6"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
log = "0.4"
anyhow = "1"
once_cell = "1"

# Async trait
async-trait = "0.1"

# WebSocket remote engine
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

# 云端 ASR WS engine（cloud feature 用）
# uuid 用于生成 task_id / event_id / request_id / voice_id；走 wss:// 必须 TLS。
# base64 用于 Qwen-ASR Realtime 协议（audio 字段为 base64 PCM）+ Tencent 签名 Base64。
# flate2 用于 ByteDance ASR 二进制协议（gzip 压缩 payload）。
# hmac + sha1 用于 Tencent ASR 签名鉴权（HMAC-SHA1）。
#（flate2/hmac/sha1 仅 *_stream.rs 副本用；Task 4 删副本后随之从 deps 移除，此处暂留。）
uuid = { version = "1", features = ["v4"], optional = true }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }

# 云端 ASR 协议层（4 provider WSS + 批引擎，下沉 crate；desktop cloud feature 复用）
octopus-asr-cloud = { path = "../asr-cloud", optional = true }

# gRPC remote engine
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# LLM polish
octopus-llm = { path = "../llm" }

# 基础设施（跨 crate 共享常量等）
octopus-infra = { path = "../infra" }

# 通用下载 crate（模型管理页下 HF 模型，复用阶段1 能力）
octopus-download = { path = "../download" }

[features]
default = ["embedded"]
embedded = ["octopus-asr"]
remote-ws = ["tokio-tungstenite", "futures-util"]
remote-grpc = ["tonic", "prost", "tonic-build"]
# 云端 ASR WS 流式识别（Aliyun / ByteDance / Tencent / Baidu）：
# 协议层下沉 octopus-asr-cloud（4 provider WSS 1:1 复刻自原 desktop *_stream.rs）。
# tokio-tungstenite 启用 native-tls 以支持 wss://；flate2/hmac/sha1 暂留（Task 4 删副本后移除）。
cloud = ["tokio-tungstenite", "tokio-tungstenite?/native-tls", "uuid", "futures-util", "base64", "flate2", "hmac", "sha1", "octopus-asr-cloud"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
