[package]
name = "octopus-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = { version = "0.12", optional = true }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# octopus-asr-local (embedded engine)
octopus-asr-local = { path = "../asr-local", optional = true }

# Unicode normalization（兼容字符归一化，如 WPS 康熙部首）
unicode-normalization.workspace = true

# OCR
octopus-ocr = { path = "../ocr" }
# Screenshot
octopus-capx = { path = "../capx" }
image = { version = "0.25", features = ["png", "webp", "jpeg"] }

# Audio
cpal = "0.16"
rubato = "0.16"

# Paste
enigo = "0.6"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
log = "0.4"
anyhow = "1"
dirs = "5"
chrono = "0.4"
once_cell = "1"
parking_lot = { workspace = true }

# Async trait
async-trait = "0.1"

# 系统状态页：自身进程 RSS+CPU / 系统级 used+total+global cpu 采样
sysinfo = "0.32"

# WebSocket remote engine
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

# 云端 ASR WS engine（cloud feature 用）
# uuid 用于生成 task_id / event_id / request_id / voice_id；走 wss:// 必须 TLS。
# base64 用于 Qwen-ASR Realtime 协议（audio 字段为 base64 PCM）+ Tencent 签名 Base64。
#（flate2/hmac/sha1 已随 *_stream.rs 副本删去，下沉 octopus-asr-cloud；engine_aliyun.rs chunk 模式仅需 uuid/base64。）
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# 云端 ASR 协议层（4 provider WSS + 批引擎，下沉 crate；desktop cloud feature 复用）
octopus-asr-cloud = { path = "../asr-cloud", optional = true }

# gRPC remote engine
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# LLM polish
octopus-llm = { path = "../llm" }
octopus-translation = { path = "../translation" }

# 基础设施（跨 crate 共享常量等）
octopus-infra = { path = "../infra" }

# 通用下载 crate（模型管理页下 HF 模型，复用阶段1 能力）
octopus-download = { path = "../download" }

# HTTP 客户端（云端模型连接测试 GET /models）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# 剪贴板历史管理（clipboard-rs 监听 + 存储 + 图片处理）
octopus-clipboard = { path = "../clipboard" }

# file:// URI 百分号解码（Linux X11/Wayland 的 text/uri-list 文件路径）
percent-encoding = "2"

# Extension Package zip 解压
zip = "2"

[features]
default = ["embedded"]
embedded = ["octopus-asr-local"]
remote-ws = ["tokio-tungstenite", "futures-util"]
remote-grpc = ["tonic", "prost", "tonic-build"]
# 云端 ASR WS 流式识别（Aliyun / ByteDance / Tencent / Baidu）：
# 协议层下沉 octopus-asr-cloud（4 provider WSS 1:1 复刻自原 desktop *_stream.rs）。
# tokio-tungstenite 启用 native-tls 以支持 wss://（engine_aliyun chunk 模式 + settings 连接测试亦用）。
cloud = ["tokio-tungstenite", "tokio-tungstenite?/native-tls", "futures-util", "octopus-asr-cloud"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSWindow", "NSApplication", "NSImage", "NSImageView", "NSView", "NSColor", "NSTrackingArea"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSData"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
gdk = "0.18"
cairo-rs = { version = "0.18", features = ["use_glib"] }
glib = "0.18"
# zbus 暂不引入——Linux AT-SPI2 实现待 v2（需事件流，见 linux_atspi.rs）

[dev-dependencies]
tempfile = "3"
