[package]
name = "octopus-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = { version = "0.12", optional = true }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"

# octopus-asr (embedded engine)
octopus-asr = { path = "../asr", optional = true }

# Audio
cpal = "0.16"
rubato = "0.16"

# Paste
enigo = "0.6"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
log = "0.4"
anyhow = "1"
once_cell = "1"

# Async trait
async-trait = "0.1"

# WebSocket remote engine
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

# gRPC remote engine
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# LLM polish
octopus-llm = { path = "../llm" }

[features]
default = ["embedded"]
embedded = ["octopus-asr"]
remote-ws = ["tokio-tungstenite", "futures-util"]
remote-grpc = ["tonic", "prost", "tonic-build"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
