<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octopus overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      height: 40px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 20px;
      color: white;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    #container.visible { opacity: 1; }

    .dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 1s ease-in-out infinite;
    }
    .dot.transcribing { background: #44aaff; }

    #text-area {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 40px;
    }

    #label {
      flex-shrink: 0;
    }

    #text-area.has-text #label {
      display: none;
    }

    #partial-text {
      display: none;
    }

    #text-area.has-text #partial-text {
      display: inline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="indicator" class="dot"></div>
    <div id="text-area">
      <span id="label">录音中</span>
      <span id="partial-text"></span>
    </div>
  </div>
  <script>
    const container = document.getElementById('container');
    const indicator = document.getElementById('indicator');
    const label = document.getElementById('label');
    const textArea = document.getElementById('text-area');
    const partialText = document.getElementById('partial-text');

    // Listen for Tauri events
    const { listen } = window.__TAURI__.event;

    listen('show-overlay', (event) => {
      const state = event.payload;
      // 重置文本
      partialText.textContent = '';
      textArea.classList.remove('has-text');

      if (state === 'recording' || state === 'streaming') {
        label.textContent = '录音中';
        indicator.className = 'dot';
        indicator.style.background = '#ff4444';
      } else if (state === 'transcribing') {
        label.textContent = '识别中';
        indicator.className = 'dot transcribing';
        indicator.style.background = '#44aaff';
      }
      container.classList.add('visible');
    });

    listen('partial-result', (event) => {
      const text = event.payload;
      if (text && text.trim()) {
        partialText.textContent = text;
        textArea.classList.add('has-text');
        // 切换指示灯为蓝色（识别中状态）
        indicator.className = 'dot transcribing';
        indicator.style.background = '#44aaff';
      }
    });

    listen('hide-overlay', () => {
      container.classList.remove('visible');
    });
  </script>
</body>
</html>
