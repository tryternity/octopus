<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octopus result</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #container.visible { opacity: 1; }

    /* 顶部拖拽区域 */
    #drag-handle {
      flex-shrink: 0;
      height: 8px;
      cursor: grab;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #drag-handle:active { cursor: grabbing; }
    #drag-handle::after {
      content: '';
      width: 24px;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 1.5px;
      margin-top: 2px;
    }

    #text-wrapper {
      flex: 1;
      padding: 2px 14px 8px 14px;
      overflow: hidden;
    }

    #result-text {
      font-size: 14px;
      line-height: 1.5;
      color: #1d1d1f;
      /* 3 行高度 = 14px * 1.5 * 3 = 63px */
      max-height: 63px;
      overflow-y: auto;
      word-break: break-all;
      user-select: text;
      cursor: text;
      outline: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.15) transparent;
    }
    #result-text:focus {
      background: rgba(0, 122, 255, 0.04);
    }
    #result-text::-webkit-scrollbar {
      width: 4px;
    }
    #result-text::-webkit-scrollbar-track {
      background: transparent;
    }
    #result-text::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="drag-handle"></div>
    <div id="text-wrapper">
      <div id="result-text" contenteditable="true"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const dragHandle = document.getElementById('drag-handle');
    const resultText = document.getElementById('result-text');

    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const currentWindow = getCurrentWindow();

    // 拖拽：顶部 drag handle 区域触发
    dragHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      currentWindow.startDragging();
    });

    // 追踪用户是否正在编辑
    let userEditing = false;
    resultText.addEventListener('focus', () => { userEditing = true; });
    resultText.addEventListener('blur', () => { userEditing = false; });

    // 用户编辑时同步内容到 Rust → record.txt
    let editTimer = null;
    resultText.addEventListener('input', () => {
      if (editTimer) clearTimeout(editTimer);
      editTimer = setTimeout(() => {
        const text = resultText.textContent || '';
        if (text.trim()) {
          currentWindow.emit('result-edited', text);
        }
      }, 300);
    });

    // 监听 Tauri 事件
    listen('show-result', (event) => {
      resultText.textContent = event.payload;
      container.classList.add('visible');
      resultText.scrollTop = resultText.scrollHeight;
    });

    // 追加文本事件（流式更新时使用）
    // 如果用户正在编辑，将新内容追加到末尾而非覆盖
    listen('update-result', (event) => {
      if (userEditing && document.activeElement === resultText) {
        // 用户正在编辑，只追加新增部分到末尾
        const current = resultText.textContent;
        const updated = event.payload;
        if (updated.startsWith(current)) {
          const suffix = updated.slice(current.length);
          if (suffix) {
            resultText.textContent = current + suffix;
          }
        } else {
          resultText.textContent = updated;
        }
      } else {
        resultText.textContent = event.payload;
      }
      resultText.scrollTop = resultText.scrollHeight;
    });

    // 清空事件（粘贴完成后）
    listen('clear-result', () => {
      resultText.textContent = '';
      container.classList.remove('visible');
    });

    listen('hide-result', () => {
      container.classList.remove('visible');
    });

    // Esc 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        currentWindow.hide();
      }
    });
  </script>
</body>
</html>
