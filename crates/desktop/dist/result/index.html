<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octopus result</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #container.visible { opacity: 1; }

    /* 顶部条：拖拽 + 工具栏 */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      height: 8px;
      transition: height 0.12s ease;
    }
    #container.toolbar-visible #top-bar { height: 32px; }

    #drag-handle {
      flex: 1;
      height: 100%;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #drag-handle:active { cursor: grabbing; }
    #container:not(.toolbar-visible) #drag-handle::after {
      content: '';
      width: 24px;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 1.5px;
    }

    /* 工具栏（默认隐藏，toolbar-visible 时显示） */
    #toolbar {
      display: none;
      align-items: center;
      gap: 2px;
      padding: 0 6px;
    }
    #container.toolbar-visible #toolbar { display: flex; }

    .tool {
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1d1d1f;
    }
    .tool:hover { color: #007aff; background: rgba(0, 0, 0, 0.06); }
    .tool.active { color: #007aff; }
    .tool[disabled] { color: rgba(0, 0, 0, 0.22); cursor: default; }
    .tool[disabled]:hover { background: transparent; }

    /* mask 图标：单 SVG 随 currentColor 变色 */
    .tool .icon {
      width: 18px;
      height: 18px;
      background: currentColor;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
    #tool-settings .icon { -webkit-mask-image: url(icons/settings.svg?v=2); mask-image: url(icons/settings.svg?v=2); }
    #tool-asr       .icon { -webkit-mask-image: url(icons/asr-engine.svg?v=2); mask-image: url(icons/asr-engine.svg?v=2); }
    #tool-denoise   .icon { -webkit-mask-image: url(icons/denoise.svg?v=2); mask-image: url(icons/denoise.svg?v=2); }
    #tool-llm       .icon { -webkit-mask-image: url(icons/llm-model.svg?v=2); mask-image: url(icons/llm-model.svg?v=2); }
    #tool-polish    .icon { -webkit-mask-image: url(icons/polish-mode.svg?v=2); mask-image: url(icons/polish-mode.svg?v=2); }
    #tool-polish-now .icon { -webkit-mask-image: url(icons/polish-now.svg?v=2); mask-image: url(icons/polish-now.svg?v=2); }

    /* 浮层（左缘对齐工具栏：toolbar padding 0 6px） */
    #popup {
      position: absolute;
      top: 30px;
      left: 6px;
      width: 360px;
      max-height: 200px;
      overflow-y: auto;
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 10;
      font-size: 13px;
    }
    #popup .option {
      padding: 6px 12px;
      cursor: pointer;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #popup .option:hover { background: rgba(0, 122, 255, 0.08); }
    #popup .option.current { color: #007aff; font-weight: 500; }
    #popup .option .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #popup .option .cat { font-size: 11px; color: rgba(0,0,0,0.4); flex-shrink: 0; }
    #popup .option.current .cat { color: rgba(0,122,255,0.6); }

    /* toast */
    #toast {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 20;
      pointer-events: none;
    }

    #text-wrapper {
      flex: 1;
      padding: 2px 14px 8px 14px;
      overflow: hidden;
    }

    #result-text {
      font-size: 14px;
      line-height: 1.5;
      color: #1d1d1f;
      /* 3 行高度 = 14px * 1.5 * 3 = 63px */
      max-height: 63px;
      overflow-y: auto;
      word-break: break-all;
      user-select: text;
      cursor: text;
      outline: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.15) transparent;
    }
    #result-text:focus {
      background: rgba(0, 122, 255, 0.04);
    }
    #result-text::-webkit-scrollbar {
      width: 4px;
    }
    #result-text::-webkit-scrollbar-track {
      background: transparent;
    }
    #result-text::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="top-bar">
      <div id="toolbar">
        <button class="tool" id="tool-settings" disabled title="系统设置" aria-label="系统设置">
          <span class="icon"></span>
        </button>
        <button class="tool" id="tool-asr" title="语音模型" aria-label="语音模型">
          <span class="icon"></span>
        </button>
        <button class="tool" id="tool-denoise" title="降噪模式" aria-label="降噪模式">
          <span class="icon"></span>
        </button>
        <button class="tool" id="tool-llm" title="润色模型" aria-label="润色模型">
          <span class="icon"></span>
        </button>
        <button class="tool" id="tool-polish" title="润色模式" aria-label="润色模式">
          <span class="icon"></span>
        </button>
        <button class="tool" id="tool-polish-now" title="立即润色" aria-label="立即润色">
          <span class="icon"></span>
        </button>
      </div>
      <div id="drag-handle"></div>
    </div>
    <div id="text-wrapper">
      <div id="result-text"></div>
    </div>
    <div id="popup" hidden></div>
    <div id="toast" hidden></div>
  </div>

  <script>
    const container = document.getElementById('container');
    const dragHandle = document.getElementById('drag-handle');
    const resultText = document.getElementById('result-text');

    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const currentWindow = getCurrentWindow();
    const { LogicalSize } = window.__TAURI__.window;
    const WIN_W = 520;
    const HIDDEN_H = 100;
    const TOOLBAR_H = 132;
    let popupOpen = false;
    let toolbarVisible = false;

    function showToolbar() {
      if (toolbarVisible) return;
      toolbarVisible = true;
      container.classList.add('toolbar-visible');
      currentWindow.setSize(new LogicalSize(WIN_W, TOOLBAR_H));
    }
    function hideToolbar() {
      if (!toolbarVisible) return;
      toolbarVisible = false;
      closePopup();                     // 离开展示区：先收浮层
      container.classList.remove('toolbar-visible');
      currentWindow.setSize(new LogicalSize(WIN_W, HIDDEN_H));
    }

    // mousemove 比 mouseenter 在「窗口可见但非前台」时更可靠触发（macOS WKWebView
    // 对非聚焦窗口的 enter 事件常漏派发）。用状态守卫避免高频 setSize 抖动。
    // hide_toolbar=false 时不绑定 hover → 工具栏始终显示（refreshActive 中处理）。
    container.addEventListener('mousemove', showToolbar);
    container.addEventListener('mouseleave', hideToolbar);

    const { invoke } = window.__TAURI__.core;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => { t.hidden = true; }, 2000);
    }

    // ── 浮层 ──
    const popup = document.getElementById('popup');
    function closePopup() {
      popup.hidden = true;
      popup.innerHTML = '';
      popupOpen = false;
    }
    function openPopup(html) {
      popup.innerHTML = html;
      popup.hidden = false;
      popupOpen = true;
    }
    // 点浮层外关闭
    document.addEventListener('mousedown', (e) => {
      if (!popupOpen) return;
      if (!popup.contains(e.target) && !e.target.closest('.tool')) closePopup();
    });
    // Esc 关浮层
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && popupOpen) closePopup();
    });

    // ── 润色 mode ──
    const POLISH_OPTIONS = [
      { mode: 0, label: '关闭' },
      { mode: 1, label: '仅最终润色' },
      { mode: 2, label: '中间 + 最终润色' },
    ];
    let currentPolishMode = 0;

    document.getElementById('tool-polish').addEventListener('click', async () => {
      const html = POLISH_OPTIONS.map(o =>
        `<div class="option${o.mode === currentPolishMode ? ' current' : ''}" data-mode="${o.mode}">
           <span>${o.mode === currentPolishMode ? '●' : '○'}</span><span class="nm">${o.label}</span>
         </div>`).join('');
      openPopup(html);
      popup.querySelectorAll('.option').forEach(el => {
        el.addEventListener('click', async () => {
          const mode = Number(el.dataset.mode);
          try {
            await invoke('set_polish_mode', { mode });
            currentPolishMode = mode;
            closePopup();
            refreshActive();
          } catch (e) {
            showToast('切换失败：' + e);
          }
        });
      });
    });

    // ── 降噪模式 ──
    const DENOISE_OPTIONS = [
      { mode: 0, label: '无降噪' },
      { mode: 1, label: '轻度降噪' },
      { mode: 2, label: '深度降噪' },
    ];
    let currentDenoiseMode = 1;

    document.getElementById('tool-denoise').addEventListener('click', async () => {
      const html = DENOISE_OPTIONS.map(o =>
        `<div class="option${o.mode === currentDenoiseMode ? ' current' : ''}" data-mode="${o.mode}">
           <span>${o.mode === currentDenoiseMode ? '●' : '○'}</span><span class="nm">${o.label}</span>
         </div>`).join('');
      openPopup(html);
      popup.querySelectorAll('.option').forEach(el => {
        el.addEventListener('click', async () => {
          const mode = Number(el.dataset.mode);
          try {
            await invoke('set_denoise_mode', { mode });
            currentDenoiseMode = mode;
            closePopup();
            refreshActive();
          } catch (e) {
            showToast('切换失败：' + e);
          }
        });
      });
    });

    // ── 立即润色 ──
    const btnPolishNow = document.getElementById('tool-polish-now');
    btnPolishNow.addEventListener('click', async () => {
      btnPolishNow.disabled = true;
      try {
        await invoke('polish_now');
        showToast('润色中…');
      } catch (e) {
        btnPolishNow.disabled = false;
        showToast('润色失败：' + e);
      }
    });
    // 润色完成（成功/失败）→ 恢复按钮
    listen('polish-done', () => {
      btnPolishNow.disabled = false;
    });

    // ── ASR 引擎 ──
    document.getElementById('tool-asr').addEventListener('click', async () => {
      let engines;
      try { engines = await invoke('list_asr_engines'); }
      catch (e) { showToast('读取引擎失败：' + e); return; }
      const html = engines.map(e =>
        `<div class="option${e.current ? ' current' : ''}" data-name="${e.name}">
           <span>${e.current ? '●' : '○'}</span><span class="nm">${e.label}</span>
         </div>`).join('');
      openPopup(html);
      popup.querySelectorAll('.option').forEach(el => {
        el.addEventListener('click', async () => {
          const name = el.dataset.name;
          try {
            await invoke('switch_asr_engine', { name });
            closePopup();
            refreshActive();
            showToast('已切换：' + name + '（下次录音生效）');
          } catch (err) {
            showToast('' + err);
          }
        });
      });
    });

    // ── LLM 润色模型 ──（首项「不选择模型」由后端注入；name 空 = 关闭润色模型）
    document.getElementById('tool-llm').addEventListener('click', async () => {
      let models;
      try { models = await invoke('list_llm_models'); }
      catch (e) { showToast('读取润色模型失败：' + e); return; }
      const html = models.map(m =>
        `<div class="option${m.current ? ' current' : ''}" data-name="${m.name}">
           <span>${m.current ? '●' : '○'}</span><span class="nm">${m.label}</span>
         </div>`).join('');
      openPopup(html);
      popup.querySelectorAll('.option').forEach(el => {
        el.addEventListener('click', async () => {
          const name = el.dataset.name;
          try {
            await invoke('switch_polish_llm', { name });
            closePopup();
            showToast(name ? '已切换润色模型：' + name : '已关闭润色模型');
            refreshActive();
          } catch (err) {
            showToast('' + err);
          }
        });
      });
    });

    // ── 当前态高亮 ──
    async function refreshActive() {
      try {
        const st = await invoke('toolbar_state');
        currentPolishMode = st.polish_mode;
        currentDenoiseMode = st.denoise_mode;
        document.getElementById('tool-polish').classList.toggle('active', st.polish_mode !== 0);
        document.getElementById('tool-asr').classList.toggle('active', true);
        document.getElementById('tool-llm').classList.toggle('active', st.polish_llm_valid);
        document.getElementById('tool-denoise').classList.toggle('active', st.denoise_mode !== 0);
        document.getElementById('tool-polish-now').classList.toggle('active', true);
        // hide_toolbar=false → 工具栏始终显示：移除 hover 监听 + 立即展开
        if (st.hide_toolbar === false) {
          container.removeEventListener('mousemove', showToolbar);
          container.removeEventListener('mouseleave', hideToolbar);
          showToolbar();
        }
      } catch (_) { /* 忽略 */ }
    }
    refreshActive();

    // 拖拽：顶部 drag handle 区域触发
    dragHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      currentWindow.startDragging();
    });

    // 监听 Tauri 事件
    listen('show-result', (event) => {
      resultText.textContent = event.payload;
      container.classList.add('visible');
      resultText.scrollTop = resultText.scrollHeight;
    });

    // 追加文本事件（流式更新时使用）
    listen('update-result', (event) => {
      resultText.textContent = event.payload;
      resultText.scrollTop = resultText.scrollHeight;
    });

    // 清空事件（粘贴完成后）
    listen('clear-result', () => {
      resultText.textContent = '';
      container.classList.remove('visible');
    });

    listen('hide-result', () => {
      container.classList.remove('visible');
    });

    // Esc 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        invoke('cancel_recording');
        currentWindow.hide();
      }
    });

    // 通知后端窗口已就绪
    invoke('result_window_ready');
  </script>
</body>
</html>
