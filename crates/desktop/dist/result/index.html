<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octopus result</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      padding: 10px 14px;
      background: #ffffff;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      cursor: default;
      user-select: none;
      position: relative;
    }
    #container.visible { opacity: 1; }

    #result-text {
      font-size: 14px;
      line-height: 1.5;
      color: #1d1d1f;
      max-height: 66px;
      overflow: hidden;
      word-break: break-all;
      user-select: text;
      cursor: text;
    }

    /* 自动关闭进度条 */
    #auto-close-bar {
      position: absolute;
      bottom: 4px;
      left: 8px;
      right: 8px;
      height: 2px;
      background: #e5e5ea;
      border-radius: 1px;
      overflow: hidden;
    }
    #auto-close-progress {
      height: 100%;
      background: #007aff;
      width: 100%;
      transition: width linear;
    }
  </style>
</head>
<body>
  <div id="container" data-tauri-drag-region>
    <div id="result-text"></div>
    <div id="auto-close-bar">
      <div id="auto-close-progress"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const resultText = document.getElementById('result-text');
    const progressBar = document.getElementById('auto-close-progress');

    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    const AUTO_CLOSE_MS = 5000;
    let autoCloseTimer = null;
    let autoCloseStart = 0;
    let paused = false;

    function startAutoClose() {
      clearAutoClose();
      paused = false;
      autoCloseStart = Date.now();

      // 设置进度条动画
      progressBar.style.transition = 'none';
      progressBar.style.width = '100%';
      progressBar.offsetWidth; // 强制 reflow
      progressBar.style.transition = `width ${AUTO_CLOSE_MS}ms linear`;
      progressBar.style.width = '0%';

      autoCloseTimer = setTimeout(() => {
        getCurrentWindow().hide();
      }, AUTO_CLOSE_MS);
    }

    function pauseAutoClose() {
      if (autoCloseTimer && !paused) {
        clearTimeout(autoCloseTimer);
        autoCloseTimer = null;
        paused = true;

        // 冻结进度条在当前位置
        const computed = getComputedStyle(progressBar);
        progressBar.style.transition = 'none';
        progressBar.style.width = computed.width;
      }
    }

    function resumeAutoClose() {
      if (paused) {
        paused = false;
        autoCloseStart = Date.now();

        // 从当前位置继续倒计时
        const currentWidth = parseFloat(progressBar.style.width);
        const parentWidth = progressBar.parentElement.offsetWidth;
        const ratio = currentWidth / parentWidth;
        const timeLeft = ratio * AUTO_CLOSE_MS;

        if (timeLeft < 100) {
          getCurrentWindow().hide();
          return;
        }

        progressBar.style.transition = `width ${timeLeft}ms linear`;
        progressBar.style.width = '0%';

        autoCloseTimer = setTimeout(() => {
          getCurrentWindow().hide();
        }, timeLeft);
      }
    }

    function clearAutoClose() {
      if (autoCloseTimer) {
        clearTimeout(autoCloseTimer);
        autoCloseTimer = null;
      }
      paused = false;
    }

    // 鼠标悬停暂停自动关闭
    container.addEventListener('mouseenter', pauseAutoClose);
    container.addEventListener('mouseleave', resumeAutoClose);

    // 文本区域阻止 drag-region 冒泡，允许文本选中
    resultText.addEventListener('mousedown', (e) => e.stopPropagation());

    // 监听 Tauri 事件
    listen('show-result', (event) => {
      const text = event.payload;
      resultText.textContent = text;
      container.classList.add('visible');
      startAutoClose();
    });

    listen('hide-result', () => {
      container.classList.remove('visible');
      clearAutoClose();
    });

    // Esc 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        clearAutoClose();
        getCurrentWindow().hide();
      }
    });

    // 窗口失焦关闭
    getCurrentWindow().onFocusChanged(({ payload: focused }) => {
      if (!focused && container.classList.contains('visible')) {
        setTimeout(() => {
          // 延迟检查，避免拖拽等操作误触发
          if (!document.hasFocus()) {
            clearAutoClose();
            getCurrentWindow().hide();
          }
        }, 300);
      }
    });
  </script>
</body>
</html>
