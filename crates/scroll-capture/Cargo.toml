[package]
name = "scroll-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
octopus-capx = { path = "../capx" }
rustfft = "6.2"
image = "0.25"
imageproc = "0.25"
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSEvent", "NSColor", "NSImage", "NSApplication", "NSScreen", "NSGraphics", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSData", "NSString"] }
core-graphics = "0.24"
core-foundation = "0.10"
