[package]
name = "octopus-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
# 项目内依赖
octopus-infra = { path = "../infra" }
# sync 基础设施（git wrapper / outline / error / privacy / store 工具）——2026-07-22 抽离
octopus-sync = { path = "../sync" }

# 加密
# OBS-ARGON2-ZEROIZE-FEATURE-MISSING 修复（2026-07-27，第七十轮）：
# 启用 zeroize feature——argon2 内部显式调 .zeroize() 的中间状态（initial_hash 含
# password+salt hash / blockhash final XOR 结果 / blockhash_bytes，约 2KB）在 drop
# 时清零。注意：64 MiB memory blocks（Vec<Block>）不会自动清零（Block 无
# ZeroizeOnDrop，Vec drop 只 dealloc），但 ~2KB 中间状态清零仍有价值 + 符合
# argon2 crate best practice（处理 password 的应用应启用 zeroize）。
argon2 = { version = "0.5", features = ["std", "zeroize"] }
aes-gcm = { version = "0.10", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
data-encoding = "2"
subtle = "2"
# A2 修复（第五轮审查）：显式启用 generic-array 的 zeroize feature——
# 让 `Hmac::finalize` 返回的 GenericArray<U64> 在离开作用域时自动 zeroize，
# 含后 32B chain code（原仅 copy 进 Zeroizing 数组被清，原件 GenericArray 残留栈帧）。
generic-array = { version = "0.14", features = ["zeroize"] }
# sync 模块（2026-07-21 git 同步）
base64 = "0.22"

# TOTP
# otpauth feature 启用 TOTP::from_url 解析 otpauth:// URL（支持 SHA256/SHA512、digits=8、period=60 变体）
# 修复 #7：原 default-features=false 关闭 otpauth，无法解析标准 otpauth URL，
# 且 totp-rs 默认 new() 强制 secret >= 128bit，拒绝 RFC 6238 下限的 80bit secret
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }

# eTLD+1
publicsuffix = "2"

# URL parsing（matcher 用）
url = "2"

# 强度评估
zxcvbn = "3"

# 序列化/工具
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4"] }
# 修复 #5：migrate_secret_keys_to_encrypted 用 db::with_db + unchecked_transaction
# 整批 UPDATE（事务化），需要直接引用 rusqlite::ToSql trait 做参数绑定。
# 与 octopus-infra 同版本同 feature（避免重复链接两份 sqlite）。
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
# 与 octopus-infra 同版本——用于 set_test_db 注入 in-memory 连接，不进入发布构建。
# （已在 [dependencies] 中；保留 [dev-dependencies] 段供后续可能新增的 dev-only 依赖）
# sync 模块测试用 tempfile 隔离文件系统
tempfile = "3"
