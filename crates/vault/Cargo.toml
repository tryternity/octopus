[package]
name = "octopus-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
# 项目内依赖
octopus-infra = { path = "../infra" }

# 加密
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
data-encoding = "2"
subtle = "2"

# TOTP
# otpauth feature 启用 TOTP::from_url 解析 otpauth:// URL（支持 SHA256/SHA512、digits=8、period=60 变体）
# 修复 #7：原 default-features=false 关闭 otpauth，无法解析标准 otpauth URL，
# 且 totp-rs 默认 new() 强制 secret >= 128bit，拒绝 RFC 6238 下限的 80bit secret
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }

# eTLD+1
publicsuffix = "2"

# URL parsing（matcher 用）
url = "2"

# 强度评估
zxcvbn = "3"

# 序列化/工具
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = { workspace = true }
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 与 octopus-infra 同版本——用于 set_test_db 注入 in-memory 连接，不进入发布构建。
rusqlite = { version = "0.31", features = ["bundled"] }
