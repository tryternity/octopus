[package]
name = "octopus-asr-local"
version = "0.1.0"
edition = "2021"

[dependencies]
# ort EP feature 按平台条件化（spec 2026-06-20）：与 config.rs apply_session_acceleration
# 的 #[cfg(target_os)] 1:1 对齐（设计意图，非编译器硬约束——ort EP 类型无条件编译、仅 register()
# FFI 块按 feature gate，故不一致不会编译失败；真正的 feature-level 保护见 spec §7.3）。
# base 放跨平台必需的 download-binaries，各平台只启用对应 EP。
# 不用 default-features=false：ort 默认集 = std/ndarray/tracing/download-binaries/tls-native/
# copy-dylibs/api-24，关掉会缺 TLS（download-binaries 编译即报缺 TLS feature）。关键在于
# 默认集本就不含 cuda/directml/coreml——保留默认集不影响「各平台只编入本平台 EP」的目标。
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.17"
anyhow = "1"
once_cell = "1"
hound = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 模型文件清单 sha256 校验（manifest，desktop/cli 共用）
sha2 = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
rustfft = "6"
# RNNoise 流式降噪（纯 Rust，内置默认模型）。曾用 DeepFilterNet3 dfn3.onnx，但该流式逐帧
# 导出模型存在缺陷（压语音），已弃用，改用 nnnoiseless（Xiph RNNoise 移植）。
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet3 原生降噪（libDF v0.5.6 + tract 0.19，spec 2026-06-17）。
# ndarray 0.15（libDF 版本）与上方 0.17（ort/asr）共存：rename 隔离，Df3Backend 边界转换。
ndarray_015 = { package = "ndarray", version = "0.15", default-features = false }
# 引用 octopus fork tryternity/DeepFilterNet tag v0.5.6（= commit 978576aa，与上游
# Rikorose/DeepFilterNet v0.5.6 等价）。自控仓库避免上游删库/移 tag；精确 commit 由 Cargo.lock 锁定。
df = { git = "https://github.com/tryternity/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", default-features = false, features = ["tract", "default-model", "transforms"] }
log = "0.4"
parking_lot = { workspace = true }
# 基础设施（跨 crate 共享常量等）
octopus-infra = { path = "../infra" }
onnx-infra = { path = "../onnx-infra" }

jieba-rs = "0.6"
pinyin = "0.10"
flate2 = "1.0"
# ITN：中文数字→阿拉伯数字（spec 2026-07-27-asr-itn-design，纯 Rust 无原生依赖）
chinese2digits = "1"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["cuda"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["directml"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# 性能基准：fbank FFT + LFR（z_perf Step 0a，2026-07-17）
# 跑法：cargo bench -p octopus-asr-local --bench fbank -- --save-baseline <name>
[[bench]]
name = "fbank"
harness = false

# 性能基准：streaming paraformer ort 推理热路径（z_perf Step 1，2026-07-17）
# 跑法：cargo bench -p octopus-asr-local --bench streaming_paraformer -- --save-baseline <name>
# 前置：HF cache 须有 csukuangfj/sherpa-onnx-streaming-paraformer-bilingual-zh-en
[[bench]]
name = "streaming_paraformer"
harness = false
