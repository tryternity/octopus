[package]
name = "octopus-record"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "sync", "io-util", "time", "rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
rusqlite = { workspace = true }
octopus-infra = { path = "../infra" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mock-helper"
path = "tests/mock_helper.rs"

