[workspace]
members = ["crates/infra", "crates/onnx-infra", "crates/asr-local", "crates/asr-cloud", "crates/server", "crates/cli", "crates/desktop", "crates/llm", "crates/dlp", "crates/download", "crates/clipboard", "crates/ocr", "crates/paddle-ocr", "crates/capx", "crates/translation"]
exclude = ["xcap"]
resolver = "2"

# ort crate 升级到 GitHub main（ORT 1.27.1）——crates.io 最新 rc.12 内置 ORT 1.24.2
# 无法解析 m2m100 int8 量化模型（IR=8 + DynamicQuantizeLinear），1.27.1 修复。
[patch.crates-io]
ort = { path = "/Users/wudarui/workspace/agent/ort" }
ort-sys = { path = "/Users/wudarui/workspace/agent/ort/ort-sys" }

# Release profile：缩减打包体积（2026-06-20，体积裁剪报告）。
# 仅加纯打包优化，不改运行时语义——三个选项都是链接期/符号表层面：
#   strip         → 删符号表（__LINKEDIT 16.4M 基本全回收）
#   lto="fat"     → 跨 crate 死代码消除 + 去重（__text 削 15-25%）
#   codegen-units → 配合 lto，更强内联/合并
# 注意：lto=fat + codegen-units=1 会显著拖慢链接（首编 +1~3 分钟）。
# 未启用（按需，非默认）：
#   opt-level="z" → 真·可选：体积优先（默认 3 速度优先），省 2~4M 换 VAD 前处理延迟微增，需 e2e 权衡。
#   panic="abort" → 不推荐：省 eh_frame ~5M，但常驻托盘 app 单处 panic 会从「unwind→app 存活」
#                   降级成「abort→直接崩溃」，Tauri 命令保护 + Drop 资源清理均失效，代价不值。
[profile.release]
#strip = true
#lto = "fat"
#codegen-units = 1

[workspace.dependencies]
parking_lot = "0.12"
