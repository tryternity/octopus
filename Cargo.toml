[workspace]
members = ["crates/infra", "crates/onnx-infra", "crates/asr-local", "crates/asr-cloud", "crates/server", "crates/cli", "crates/desktop", "crates/llm", "crates/dlp", "crates/download", "crates/clipboard", "crates/ocr", "crates/paddle-ocr", "crates/capx", "crates/translation", "crates/search", "crates/vault"]
exclude = ["xcap"]
resolver = "2"

[profile.release]

[profile.optimize]
# Release profile：缩减打包体积 + 提升运行时性能
# 三选项均为链接期/符号表层优化，不改运行时语义：
#   strip         → 删符号表（__LINKEDIT 16.4M 基本全回收）
#   lto="fat"     → 跨 crate 死代码消除 + 去重 + 更强内联（ort 推理 + fbank FFT 直接受益）
#   codegen-units → 配合 lto，单 codegen unit 最强内联
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
# 未启用（按需）：
#   opt-level="z" → 体积优先（默认 3 速度优先），省 2~4M 换 VAD 前处理延迟微增，需 e2e 权衡
#   panic="abort" → 不推荐：省 eh_frame ~5M，但常驻托盘 app 单处 panic 会从「unwind→app 存活」
#                   降级成「abort→直接崩溃」，Tauri 命令保护 + Drop 资源清理均失效，代价不值。

[profile.profiling]
inherits = "release"
# 强制把 DWARF 符号嵌进 binary（samply/atos 直接可读，无需 dSYM）
#   debug="full"          → 完整 DWARF（行号 + 函数名 + 参数）
#   split-debuginfo="off" → 不分离到 dSYM（macOS 默认 "packed" 会把符号挪到 .dSYM 目录）
#   strip="none"          → 保留所有符号（覆盖 release 的 strip 选项）
# 代价：binary 体积从 ~97MB 涨到 ~300-500MB，但只用于 perf session。
debug = "full"
split-debuginfo = "off"
strip = "none"

[workspace.dependencies]
parking_lot = "0.12"
unicode-normalization = "0.1"
