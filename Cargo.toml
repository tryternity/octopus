[workspace]
members = ["crates/infra", "crates/onnx-infra", "crates/asr-local", "crates/asr-cloud", "crates/server", "crates/cli", "crates/desktop", "crates/llm", "crates/dlp", "crates/download", "crates/clipboard", "crates/ocr", "crates/paddle-ocr", "crates/capx", "crates/translation", "crates/search", "crates/vault", "crates/sync", "crates/scheduler", "crates/record", "crates/pty", "crates/convert"]
# dlp 是独立 sidecar（yt-dlp 封装），无任何 crate 依赖它（cli 通过 shell-out
# 查找预编译二进制）。排除出 default-members，让日常 cargo build/test 不编译它，
# 加速迭代；cargo build -p octopus-dlp 仍可单独编译 sidecar。
default-members = ["crates/infra", "crates/onnx-infra", "crates/asr-local", "crates/asr-cloud", "crates/server", "crates/cli", "crates/desktop", "crates/llm", "crates/download", "crates/clipboard", "crates/ocr", "crates/paddle-ocr", "crates/capx", "crates/translation", "crates/search", "crates/vault", "crates/sync", "crates/scheduler", "crates/record", "crates/convert"]
exclude = ["xcap"]
resolver = "2"

[profile.release]

[profile.optimize]
# Release profile：缩减打包体积 + 提升运行时性能
# 三选项均为链接期/符号表层优化，不改运行时语义：
#   strip         → 删符号表（__LINKEDIT 16.4M 基本全回收）
#   lto="fat"     → 跨 crate 死代码消除 + 去重 + 更强内联（ort 推理 + fbank FFT 直接受益）
#   codegen-units → 配合 lto，单 codegen unit 最强内联
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
# 未启用（按需）：
#   opt-level="z" → 体积优先（默认 3 速度优先），省 2~4M 换 VAD 前处理延迟微增，需 e2e 权衡
#   panic="abort" → 不推荐：省 eh_frame ~5M，但常驻托盘 app 单处 panic 会从「unwind→app 存活」
#                   降级成「abort→直接崩溃」，Tauri 命令保护 + Drop 资源清理均失效，代价不值。

[profile.profiling]
# perf 测量用——inherits optimize 拿到与生产一致的 LTO/内联，再叠符号信息。
# 这样火焰图的内联情况与用户实际 release build 一致。
inherits = "optimize"
# 强制把 DWARF 符号嵌进 binary（samply/atos 直接可读，无需 dSYM）
#   debug="full"          → 完整 DWARF（行号 + 函数名 + 参数）
#   split-debuginfo="off" → 不分离到 dSYM（macOS 默认 "packed" 会把符号挪到 .dSYM 目录）
#   strip="none"          → 保留所有符号（覆盖 optimize 的 strip=true）
# 代价：链接时间 +1~3 分钟（LTO），binary ~104MB（含符号）。
debug = "full"
split-debuginfo = "off"
strip = "none"

[workspace.dependencies]
parking_lot = "0.12"
unicode-normalization = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
once_cell = "1"
async-trait = "0.1"
sha2 = "0.10"
# 转 Markdown（ActionBar markdown 命令，spec 2026-08-18）。anydoc 0.1.x 锁死防 API 变动。
anydoc = "=0.1.9"
htmd = "0.5"
walkdir = "2"
# tokio：workspace 声明 full（desktop 等需要）。record/translation 刻意用细分 features
# 精简（独立编译时不拉 full），不用 workspace 引用。
tokio = { version = "1", features = ["full"] }
